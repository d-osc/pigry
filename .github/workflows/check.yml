name: Check

# Cross-platform check on every update — verifies the frontend build/tests
# and the Rust backend compile on Windows / Linux / macOS (x86_64 + arm64).
# Release builds live in release.yml (tag push).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows — x86_64 native + arm64 cross-check
          - platform: windows-latest
            cross: 'aarch64-pc-windows-msvc'
          # Linux — x86_64 native
          - platform: ubuntu-22.04
            cross: ''
          # Linux — arm64 native
          - platform: ubuntu-24.04-arm
            cross: ''
          # macOS — Apple Silicon native (x86_64 ships via the universal
          # release build in release.yml)
          - platform: macos-latest
            cross: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cross }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: check-${{ matrix.platform }}

      - name: Install Linux dependencies (x86_64)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libudev-dev

      - name: Install Linux dependencies (arm64)
        if: matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libudev-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck + frontend build
        run: npm run build

      # The E2E runner tests (tests/e2e-cli.test.mjs) launch real browsers, so install them before `npm test`.
      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Frontend tests
        run: npm test

      - name: Lint (zero warnings)
        run: npm run lint

      - name: UI and visual regression tests
        if: matrix.platform == 'windows-latest'
        run: npm run test:ui

      - name: Upload UI failure traces
        if: failure() && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Rust check (backend, native)
        working-directory: src-tauri
        run: cargo check --all-targets

      # Cross-arch check where the runner is not the target arch
      # (Windows arm64 has no native runner — checked from the x64 host).
      - name: Rust check (cross ${{ matrix.cross }})
        if: matrix.cross != ''
        working-directory: src-tauri
        run: cargo check --all-targets --target ${{ matrix.cross }}
