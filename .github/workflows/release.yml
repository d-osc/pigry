name: Release

# Deploy builds for Windows / Linux / macOS on x86_64 + arm64.
# Trigger: push a version tag (v0.1.0) or run manually from the Actions tab.
# Draft release is created/updated by tauri-action; review and publish.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows — x86_64 (NSIS + MSI installers)
          - platform: windows-latest
            args: ''
          # Windows — arm64 (NSIS installer, cross-compiled from the x64 host)
          - platform: windows-latest
            cross: aarch64-pc-windows-msvc
            args: '--target aarch64-pc-windows-msvc'
          # Linux — x86_64 (deb/rpm/AppImage)
          - platform: ubuntu-22.04
            args: ''
          # Linux — arm64 (native GitHub arm runner)
          - platform: ubuntu-24.04-arm
            args: ''
          # macOS — Apple Silicon (dmg + app)
          - platform: macos-14
            args: '--target aarch64-apple-darwin'
          # macOS — Intel (dmg + app)
          - platform: macos-13
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cross || (matrix.platform == 'macos-14' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '') }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}-${{ matrix.args }}

      # Linux build dependencies (webkit2gtk + appindicator for tray)
      - name: Install Linux dependencies (x86_64)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libudev-dev

      - name: Install Linux dependencies (arm64)
        if: matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libudev-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PIGRY ${{ github.ref_name }}'
          releaseBody: |
            Installers for Windows, Linux and macOS (x86_64 + arm64).

            **Windows** — .msi / .exe (NSIS)
            **Linux** — .deb / .rpm / .AppImage
            **macOS** — .dmg (Apple Silicon + Intel)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
