name: Release

# Deploy builds for Windows / Linux / macOS on x86_64 + arm64.
# Trigger: push a version tag (v0.1.0) or run manually from the Actions tab.
# Draft release is created/updated by tauri-action; review and publish.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  pigry-server:
    strategy:
      matrix:
        include:
          - platform: ubuntu-22.04
            arch: x86_64
          - platform: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - name: Build the Linux server
        env:
          TARGET: ${{ matrix.arch }}-unknown-linux-musl
          ARCH: ${{ matrix.arch }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          host="$(rustc -vV | sed -n 's/^host: //p')"
          linker="$(rustc --print sysroot)/lib/rustlib/$host/bin/rust-lld"
          CC=musl-gcc RUSTFLAGS="-C linker=$linker -C linker-flavor=ld.lld -C target-feature=+crt-static" \
            cargo build --locked --release --manifest-path src-remote/Cargo.toml --target "$TARGET"
          server="src-remote/target/$TARGET/release/pigry-server"
          headers="$(readelf --program-headers --wide "$server")"
          if grep -qw INTERP <<< "$headers"; then
            echo "PIGRY Server must run without an external dynamic loader."
            exit 1
          fi
          test "$("$server" </dev/null)" = "PIGRY_SERVER 1"
          mkdir -p src-tauri/remote-bin
          cp "$server" "src-tauri/remote-bin/pigry-server-linux-$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: pigry-server-linux-${{ matrix.arch }}
          path: src-tauri/remote-bin/pigry-server-linux-${{ matrix.arch }}
          if-no-files-found: error

  build:
    needs: pigry-server
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows — x86_64 (NSIS + MSI installers)
          - platform: windows-latest
            args: ''
          # Windows — arm64 (NSIS installer, cross-compiled from the x64 host)
          - platform: windows-latest
            cross: aarch64-pc-windows-msvc
            args: '--target aarch64-pc-windows-msvc'
          # Linux — x86_64 (deb/rpm/AppImage)
          - platform: ubuntu-22.04
            args: ''
          # Linux — arm64 (native GitHub arm runner)
          - platform: ubuntu-24.04-arm
            args: ''
          # macOS — universal binary (Intel + Apple Silicon in one .dmg)
          - platform: macos-latest
            cross: aarch64-apple-darwin,x86_64-apple-darwin
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pigry-server-linux-*
          path: src-tauri/remote-bin
          merge-multiple: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cross || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}-${{ matrix.args }}

      # Linux build dependencies (webkit2gtk + appindicator for tray)
      - name: Install Linux dependencies (x86_64)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libudev-dev

      - name: Install Linux dependencies (arm64)
        if: matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libudev-dev

      - name: Install frontend dependencies
        run: npm ci

      # The tauri CLI's universal build lipos only the main binary, but the
      # bundler copies every cargo bin — build the pigry-shell REPL host for
      # both arches and lipo it into place or the macOS bundle fails.
      - name: Prepare universal pigry-shell (REPL host)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p src-tauri/target/universal-apple-darwin/release
          cargo build --manifest-path src-tauri/Cargo.toml --release --target aarch64-apple-darwin --bin pigry-shell
          cargo build --manifest-path src-tauri/Cargo.toml --release --target x86_64-apple-darwin --bin pigry-shell
          lipo -create \
            src-tauri/target/aarch64-apple-darwin/release/pigry-shell \
            src-tauri/target/x86_64-apple-darwin/release/pigry-shell \
            -output src-tauri/target/universal-apple-darwin/release/pigry-shell

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PIGRY ${{ github.ref_name }}'
          releaseBody: |
            Installers for Windows, Linux and macOS (x86_64 + arm64).

            **Windows** — .msi / .exe (NSIS)
            **Linux** — .deb / .rpm / .AppImage
            **macOS** — .dmg (universal: Intel + Apple Silicon)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload updater signatures
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          sig_files=(src-tauri/target/release/bundle/*/*.sig src-tauri/target/*/release/bundle/*/*.sig)
          echo "Found ${#sig_files[@]} signature file(s):"
          for f in "${sig_files[@]}"; do echo "  $f"; done
          if [ ${#sig_files[@]} -gt 0 ]; then
            gh release upload "${{ github.ref_name }}" --clobber "${sig_files[@]}"
          fi
  # Builds latest.json for the in-app updater from the signed bundles
  # (Windows NSIS + Linux AppImage + macOS app.tar.gz) uploaded by the build jobs.
  finalize-updater:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download signed bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p updater
          gh release download "${{ github.ref_name }}" --dir updater --clobber \
            --pattern "*.AppImage" --pattern "*.AppImage.sig" \
            --pattern "*-setup.exe" --pattern "*-setup.exe.sig" \
            --pattern "*.app.tar.gz" --pattern "*.app.tar.gz.sig"
      - name: Build latest.json
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/build-updater-json.mjs
      - name: Upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" updater/latest.json --clobber
