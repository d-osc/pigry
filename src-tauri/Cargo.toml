[package]
name = "pigry"
version = "0.3.3"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pigry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Console-subsystem host for the Pigry Bash REPL — the GUI main binary gets
# no stdio under ConPTY in release builds (windows_subsystem = "windows").
[[bin]]
name = "pigry-shell"
path = "src/bin/pigry_shell.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
git2 = "0.20"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
notify = "7"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
chromiumoxide = { version = "0.7", features = ["tokio-runtime"] }
pdf-extract = "0.7"
portable-pty = "0.8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# macOS release builds cross-compile universal binaries (x86_64 + aarch64 in
# one .dmg). GitHub's arm64 runners only carry a native OpenSSL, which the
# x86_64 target can't link — build OpenSSL from source for the bundle instead.
[target.'cfg(target_os = "macos")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
